services:
  postgres:
    extends:
      file: docker-compose.dbs.yml
      service: postgres
    ports:
      - 5432:5432
    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    extends:
      file: docker-compose.dbs.yml
      service: redis
    ports:
      - 6379:6379

  elasticsearch:
    extends:
      file: docker-compose.dbs.yml
      service: elasticsearch
    ports:
      - 9200:9200
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data

  mongodb:
    extends:
      file: docker-compose.dbs.yml
      service: mongodb
    volumes:
      - mongo:/data/db
    ports:
      - 27017:27017

  minio:
    image: minio/minio
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    environment:
      MINIO_ROOT_USER: trackdechets
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "8900:8900"
    volumes:
      - minio:/data/minio
    command: minio server /data/minio --console-address ":8900"

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set td http://minio:9000 trackdechets password; do echo 'waiting for minio...'; sleep 2; done;
      mc mb -p td/td-storage;
      mc mb -p td/td-bsds-templates;
      mc mb -p td/registry-errors-integration;
      mc mb -p td/registry-imports-integration;
      mc mb -p td/registry-exports-integration;
      mc mb -p td/registry-models-integration;
      mc mb -p td/registry-exhaustive-exports-integration;
      mc mb -p td/texs-analysis-integration;
      echo '✅ MinIO buckets created';
      "

  nginx:
    image: nginx:1.19.6
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    network_mode: $NGINX_NETWORK_MODE
    volumes:
      - ./nginx/templates:/etc/nginx/templates
    environment:
      API_HOST: $API_HOST
      API_PORT: $API_PORT
      NOTIFIER_HOST: $NOTIFIER_HOST
      UI_HOST: $UI_HOST
      DEVELOPERS_HOST: $DEVELOPERS_HOST
      NGINX_PROXY_HOST: $NGINX_PROXY_HOST
      ELASTIC_SEARCH_HOST: $ELASTIC_SEARCH_HOST
      STORYBOOK_HOST: $STORYBOOK_HOST
    ports:
      - "80:80"

volumes:
  postgres:
  elasticsearch:
  mongo:
  minio:
